services:
  postgres:
    image: postgres:16-alpine
    container_name: my-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_pro_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d my_pro_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
